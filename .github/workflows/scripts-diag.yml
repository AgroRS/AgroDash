name: Diagnóstico temporário — pesquisa fonte Conab/Bolsa de Cereales

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: CKAN dados.gov.br — buscar datasets Conab progresso de safra
        run: |
          echo "=== dados.gov.br CKAN package_search ==="
          curl -sS "https://dados.gov.br/api/3/action/package_search?q=conab+progresso+safra&rows=10" | head -c 4000
          echo ""
          echo ""
          echo "=== dados.gov.br CKAN package_search (organization=conab) ==="
          curl -sS "https://dados.gov.br/api/3/action/package_search?q=organization:conab&rows=20" | head -c 4000
          echo ""

      - name: Conab progresso-de-safra — HTML bruto
        run: |
          echo "=== conab.gov.br/info-agro/safras/progresso-de-safra ==="
          curl -sS -L "https://www.conab.gov.br/info-agro/safras/progresso-de-safra" -o /tmp/progresso.html
          echo "status/size:"; wc -c /tmp/progresso.html
          echo "--- links .csv/.xlsx/.xls/api encontrados ---"
          grep -oE 'href="[^"]*\.(csv|xlsx|xls|json)"' /tmp/progresso.html | sort -u | head -40
          echo "--- qualquer link contendo download ---"
          grep -oE 'href="[^"]*download[^"]*"' /tmp/progresso.html | sort -u | head -40

      - name: Portal de Informações Agropecuárias — download-arquivos
        run: |
          echo "=== portaldeinformacoes.conab.gov.br/download-arquivos.html ==="
          curl -sS -L "https://portaldeinformacoes.conab.gov.br/download-arquivos.html" -o /tmp/portal.html
          wc -c /tmp/portal.html
          grep -oiE 'href="[^"]*"' /tmp/portal.html | grep -iE 'progresso|plantio|colheita|\.csv|\.xlsx|\.json' | sort -u | head -40

      - name: dados.conab.gov.br (tentativa de subdomínio de dados abertos)
        run: |
          for url in "https://www.conab.gov.br/dados-abertos-m" "https://api.conab.gov.br" "https://dadosabertos.conab.gov.br"; do
            echo "=== $url ==="
            curl -sS -o /dev/null -w "status=%{http_code}\n" -L "$url" || echo "falhou"
          done
