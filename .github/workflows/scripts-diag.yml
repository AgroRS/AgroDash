name: Diagnóstico temporário — pesquisa fonte Conab/Bolsa de Cereales

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: CKAN dados.gov.br — verboso
        run: |
          echo "=== status HTTP puro ==="
          curl -sS -o /tmp/ckan1.json -w "status=%{http_code} size=%{size_download}\n" "https://dados.gov.br/api/3/action/package_search?q=conab%20progresso%20safra&rows=10"
          echo "--- corpo ---"
          cat /tmp/ckan1.json | head -c 3000
          echo ""
          echo "=== busca por organization_id conab ==="
          curl -sS -o /tmp/ckan2.json -w "status=%{http_code} size=%{size_download}\n" "https://dados.gov.br/api/3/action/organization_list?q=conab"
          cat /tmp/ckan2.json | head -c 2000
          echo ""
          echo "=== busca ampla por 'progresso de safra' ==="
          curl -sS -o /tmp/ckan3.json -w "status=%{http_code} size=%{size_download}\n" "https://dados.gov.br/api/3/action/package_search?q=%22progresso%20de%20safra%22&rows=10"
          cat /tmp/ckan3.json | head -c 3000

      - name: Conab progresso-de-safra — procurar API/JSON embutido no HTML
        run: |
          curl -sS -L "https://www.conab.gov.br/info-agro/safras/progresso-de-safra" -o /tmp/progresso.html
          echo "=== scripts externos (src=) ==="
          grep -oE '<script[^>]*src="[^"]*"' /tmp/progresso.html | sort -u | head -30
          echo ""
          echo "=== qualquer referência a /api/ ou .json no HTML ==="
          grep -oE '"[^"]*(/api/|\.json)[^"]*"' /tmp/progresso.html | sort -u | head -40
          echo ""
          echo "=== qualquer referência a 'window.' com dados embutidos ==="
          grep -oE 'window\.[A-Za-z_]+\s*=' /tmp/progresso.html | sort -u | head -20
          echo ""
          echo "=== títulos/headings da página (contexto) ==="
          grep -oE '<h[1-3][^>]*>[^<]*</h[1-3]>' /tmp/progresso.html | head -20

      - name: dados-abertos-m — conteúdo
        run: |
          curl -sS -L "https://www.conab.gov.br/dados-abertos-m" -o /tmp/da.html
          wc -c /tmp/da.html
          echo "--- links relevantes ---"
          grep -oiE 'href="[^"]*"' /tmp/da.html | grep -iE 'progresso|safra|plantio|colheita|dataset|api|\.csv|\.json' | sort -u | head -40
