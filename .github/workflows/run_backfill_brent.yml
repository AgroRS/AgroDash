name: "[Uso único] Backfill histórico do Brent"

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Rodar backfill_brent.py
        working-directory: scripts
        run: python backfill_brent.py ../members/mig7lpqvfqpa36k5v3u8rc98/index.html
      - name: Commitar alterações
        run: |
          git config user.name "dashagro-bot"
          git config user.email "actions@github.com"
          git add members/mig7lpqvfqpa36k5v3u8rc98/index.html
          git diff --staged --quiet && echo "Nada mudou, nada para commitar." || git commit -m "Backfill: histórico completo do Brent (BZ=F) no Bloco 5"
          git push
