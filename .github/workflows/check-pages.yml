name: Diagnóstico temporário — checar GitHub Pages

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checar status do GitHub Pages
        run: |
          echo "=== HEAD https://agrors.github.io/AgroDash/ ==="
          curl -sS -o /dev/null -w "status=%{http_code} content_type=%{content_type} size=%{size_download}\n" -L https://agrors.github.io/AgroDash/
          echo ""
          echo "=== primeiras linhas do HTML ==="
          curl -sS -L https://agrors.github.io/AgroDash/ | head -c 500
