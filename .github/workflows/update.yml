name: Atualizar DashAgro

on:
  schedule:
    # toda sexta-feira às 22:00 UTC (~19h em Brasília) — depois do fechamento
    # do relatório semanal do CFTC (COT sai às sextas, ~15h30 horário de NY)
    - cron: "0 22 * * 5"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write   # necessário para o workflow poder commitar de volta no repositório

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os scripts de atualização
        env:
          USDA_PSD_API_KEY: ${{ secrets.USDA_PSD_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        working-directory: scripts
        run: python main.py ../members/mig7lpqvfqpa36k5v3u8rc98/index.html

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "dashagro-bot"
          git config user.email "actions@github.com"
          git add members/mig7lpqvfqpa36k5v3u8rc98/index.html
          git diff --staged --quiet && echo "Nada mudou, nada para commitar." || git commit -m "Atualização automática de dados — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
